name: Remarcar produtos

# Reclassifica a marca dos produtos já salvos usando a lista de marcas do banco.
#
# Corrigir a derivação só vale para o que a ingestão ler daqui em diante:
# produto já cadastrado casa por nome no re-scrape e carrega a marca antiga para
# sempre. Este workflow fecha essa lacuna.
#
# Por padrão NÃO escreve nada: mostra o plano de trocas para conferência.
# Só com "aplicar" marcado é que o banco muda.
#
# Entra pelo mesmo caminho SSH do deploy e chama /api/rebrand em 127.0.0.1, com
# o INGEST_SECRET lido do .env do servidor — o segredo nunca é impresso.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar as trocas (sem marcar, só mostra o plano)"
        required: false
        default: false
        type: boolean

concurrency:
  group: rebrand-production
  cancel-in-progress: false

jobs:
  remarcar:
    name: Reclassificar marcas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verificar credenciais
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ] || [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pulado — configure VPS_HOST, VPS_USER e VPS_SSH_KEY. Veja DEPLOY.md, seção 4.1."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar chave SSH
        if: steps.check.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS não definido — identidade do servidor não fixada."
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Rodar a reclassificação
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DIR: ${{ secrets.VPS_PROJECT_DIR }}
          APLICAR: ${{ inputs.aplicar }}
        run: |
          set -Eeuo pipefail
          remote_dir=$(printf '%q' "${DIR:-}")
          # Só "true" liga a escrita; qualquer outra coisa é leitura.
          if [ "$APLICAR" = "true" ]; then aplicar=1; else aplicar=0; fi
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -p "${PORT:-22}" \
              "$USER_NAME@$HOST" \
              "DEPLOY_DIR=$remote_dir APLICAR=$aplicar bash -s" <<'REMOTE'
          set -Eeuo pipefail

          dir="${DEPLOY_DIR:-}"
          if [ -z "$dir" ]; then
            dir=$(docker inspect mf-prod-app \
              --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' \
              2>/dev/null || true)
          fi
          [ -n "$dir" ] && [ -d "$dir" ] || { echo "erro: pasta do projeto não localizada." >&2; exit 1; }
          cd "$dir"

          # Lê do .env sem executá-lo (um .env não é script — ver deploy.sh).
          read_env() {
            sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" .env | head -1 |
              sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"
          }
          secret=$(read_env INGEST_SECRET)
          port=$(read_env APP_PORT); port=${port:-3000}
          [ -n "$secret" ] || { echo "erro: INGEST_SECRET não está no .env do servidor." >&2; exit 1; }

          psql() {
            docker exec mf-prod-db psql -U postgres -d melhorfilamento -P pager=off "$@"
          }

          echo "===================== ANTES ====================="
          psql -c 'SELECT p.kind, count(DISTINCT p."brandId") AS marcas_visiveis
                   FROM "Product" p
                   WHERE EXISTS (SELECT 1 FROM "Offer" o
                                 WHERE o."productId" = p.id AND o.status = $$APPROVED$$)
                   GROUP BY p.kind ORDER BY p.kind;'

          if [ "${APLICAR:-0}" = "1" ]; then
            echo "===================== APLICANDO ================="
            url="http://127.0.0.1:${port}/api/rebrand?aplicar=1"
          else
            echo "===================== SÓ O PLANO ================"
            url="http://127.0.0.1:${port}/api/rebrand"
          fi

          # O segredo vai no header e nunca é impresso.
          http=$(curl -sS -o /tmp/rebrand-out.json -w '%{http_code}' \
                   --max-time 300 -X POST \
                   -H "x-ingest-secret: $secret" \
                   "$url" || echo "000")
          echo "HTTP $http"
          # jq deixa o plano legível; sem ele, o JSON cru já serve.
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/rebrand-out.json || cat /tmp/rebrand-out.json
          else
            cat /tmp/rebrand-out.json
          fi
          echo ""

          if [ "${APLICAR:-0}" = "1" ]; then
            echo "===================== DEPOIS ===================="
            psql -c 'SELECT p.kind, count(DISTINCT p."brandId") AS marcas_visiveis
                     FROM "Product" p
                     WHERE EXISTS (SELECT 1 FROM "Offer" o
                                   WHERE o."productId" = p.id AND o.status = $$APPROVED$$)
                     GROUP BY p.kind ORDER BY p.kind;'
          fi

          [ "$http" = "200" ] || { echo "erro: a rota respondeu HTTP $http" >&2; exit 1; }
          REMOTE

      - name: Remover a chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
